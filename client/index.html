<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#22A05B">
<title>ReBuket.tj — Букеты и сладости</title>
<meta name="description" content="ReBuket.tj — маркетплейс букетов, корзин, мишек и сладостей в Таджикистане">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">

<style>
/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green:    #22A05B;
  --green-d:  #178A48;
  --green-l:  #e6f7ee;
  --green-m:  rgba(34,160,91,.12);
  --black:    #0f1117;
  --mid:      #2e3340;
  --gray:     #8a8fa3;
  --border:   #e4e8ef;
  --warm:     #f9f8f5;
  --red:      #e53935;
  --rr:       18px;
  --nav-h:    68px;
  --max-w:    1200px;
  --shadow-s: 0 2px 12px rgba(0,0,0,.07);
  --shadow-m: 0 8px 32px rgba(0,0,0,.10);
  --shadow-l: 0 20px 64px rgba(0,0,0,.14);
}

html { scroll-behavior: smooth; }
body {
  font-family: 'Outfit', sans-serif;
  font-size: 15px;
  color: var(--black);
  background: #fff;
  min-height: 100vh;
  overflow-x: hidden;
}

h1,h2,h3 { font-family: 'Cormorant Garamond', serif; line-height: 1.15; }
a { text-decoration: none; cursor: pointer; }
ul { list-style: none; }
button { cursor: pointer; font-family: inherit; }
input, select, textarea {
  font-family: inherit; font-size: .95rem; width: 100%;
  padding: 11px 14px; border: 1.5px solid var(--border);
  border-radius: 10px; background: #fff; color: var(--black);
  outline: none; transition: border-color .2s;
}
input:focus, select:focus, textarea:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-m); }
textarea { resize: vertical; min-height: 90px; }
label { display: block; font-size: .82rem; font-weight: 600; color: var(--mid); margin-bottom: 6px; }

/* ============================================================
   UTILITY
   ============================================================ */
.section { max-width: var(--max-w); margin: 0 auto; padding: 32px 24px 64px; }
.section-title { font-size: 2rem; margin-bottom: 6px; }
.section-sub { color: var(--gray); font-size: .9rem; margin-bottom: 28px; }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 7px; padding: 12px 24px; border-radius: 50px;
  font-size: .9rem; font-weight: 600; border: 2px solid transparent;
  transition: all .22s; white-space: nowrap; font-family: 'Outfit', sans-serif;
}
.btn-primary  { background: var(--green); color: #fff; }
.btn-primary:hover  { background: var(--green-d); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(34,160,91,.35); }
.btn-black    { background: var(--black); color: #fff; }
.btn-black:hover    { background: #222; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.btn-outline  { background: transparent; border-color: var(--black); color: var(--black); }
.btn-outline:hover  { background: var(--black); color: #fff; }
.btn-tg       { background: #229ED9; color: #fff; }
.btn-tg:hover { background: #1a8bc1; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(34,158,217,.35); }
.btn-sm { padding: 8px 16px; font-size: .82rem; }

/* ============================================================
   NAV
   ============================================================ */
nav {
  position: sticky; top: 0; z-index: 900;
  background: rgba(255,255,255,.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  height: var(--nav-h);
}
.nav-wrap {
  max-width: var(--max-w); height: 100%; margin: 0 auto; padding: 0 24px;
  display: flex; align-items: center; gap: 24px;
}
.logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.5rem; font-weight: 700; color: var(--black);
  cursor: pointer; white-space: nowrap; flex-shrink: 0; letter-spacing: -.01em;
}
.logo em { color: var(--green); font-style: normal; }
.nav-links { display: flex; align-items: center; gap: 2px; flex: 1; }
.nav-links a {
  padding: 8px 14px; border-radius: 9px; font-size: .88rem; font-weight: 500;
  color: var(--mid); transition: background .15s, color .15s; white-space: nowrap;
}
.nav-links a:hover { background: var(--green-l); color: var(--green-d); }
.nav-links .nav-admin { color: var(--green); font-weight: 600; }
.nav-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

.nav-cart {
  position: relative; display: flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--warm); border: 1.5px solid var(--border);
  font-size: 1.15rem; transition: all .2s; flex-shrink: 0;
}
.nav-cart:hover { background: var(--green-l); border-color: var(--green); }
.cart-badge {
  position: absolute; top: -4px; right: -4px;
  background: var(--red); color: #fff;
  font-size: .65rem; font-weight: 700; min-width: 18px; height: 18px;
  border-radius: 50px; display: flex; align-items: center; justify-content: center;
  padding: 0 4px; border: 2px solid #fff;
  opacity: 0; transform: scale(0);
  transition: all .22s cubic-bezier(.34,1.56,.64,1);
}
.cart-badge.show { opacity: 1; transform: scale(1); }

.btn-shop-login {
  display: flex; align-items: center; gap: 6px;
  padding: 9px 18px; background: var(--warm);
  border: 1.5px solid var(--border); border-radius: 50px;
  font-size: .85rem; font-weight: 600; color: var(--mid);
  transition: all .2s; white-space: nowrap;
}
.btn-shop-login:hover { background: var(--green); border-color: var(--green); color: #fff; }

.burger {
  display: none; flex-direction: column; justify-content: center;
  align-items: center; gap: 5px; width: 42px; height: 42px;
  background: none; border: none; margin-left: auto; padding: 4px;
}
.burger span { display: block; width: 22px; height: 2px; background: var(--black); border-radius: 2px; transition: all .25s; }
.burger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.burger.open span:nth-child(2) { opacity: 0; }
.burger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

.nav-drawer {
  display: none; position: fixed; top: var(--nav-h); left: 0; right: 0;
  background: #fff; border-bottom: 1.5px solid var(--border);
  padding: 12px 20px 20px; z-index: 850; flex-direction: column; gap: 2px;
  box-shadow: 0 8px 32px rgba(0,0,0,.08);
}
.nav-drawer.open { display: flex; }
.nav-drawer a {
  padding: 12px 14px; border-radius: 10px; font-size: .95rem;
  font-weight: 500; color: var(--mid); transition: background .15s;
}
.nav-drawer a:hover { background: var(--green-l); }
.nav-drawer .drawer-shop { color: var(--green); font-weight: 700; }
.drawer-cart-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; border-radius: 10px;
}

/* ============================================================
   PAGES
   ============================================================ */
.page { display: none; }
.page.active { display: block; }

/* ============================================================
   HERO
   ============================================================ */
.hero {
  background: linear-gradient(145deg, #f4faf7 0%, #eef7f2 40%, #f5f4f0 100%);
  border-bottom: 1px solid var(--border);
  padding: 88px 24px 72px;
  position: relative; overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute; top: -60px; right: -80px;
  width: 480px; height: 480px;
  background: radial-gradient(circle, rgba(34,160,91,.08) 0%, transparent 70%);
  border-radius: 50%; pointer-events: none;
}
.hero::after {
  content: '';
  position: absolute; bottom: -40px; left: -40px;
  width: 320px; height: 320px;
  background: radial-gradient(circle, rgba(34,160,91,.06) 0%, transparent 70%);
  border-radius: 50%; pointer-events: none;
}
.hero-inner { max-width: 660px; margin: 0 auto; text-align: center; position: relative; z-index: 1; }
.hero-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 18px; background: rgba(34,160,91,.10);
  border: 1px solid rgba(34,160,91,.22); border-radius: 50px;
  font-size: .78rem; font-weight: 600; color: var(--green-d);
  margin-bottom: 24px; letter-spacing: .04em; text-transform: uppercase;
}
.hero h1 {
  font-size: clamp(2.8rem, 7vw, 4.8rem); font-weight: 700; line-height: 1.05;
  margin-bottom: 20px; color: var(--black); letter-spacing: -.02em;
}
.hero h1 span { color: var(--green); }
.hero p {
  font-size: 1.05rem; color: var(--gray); line-height: 1.75; margin-bottom: 36px;
  font-weight: 400;
}
.hero-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

/* ============================================================
   HOME CATEGORIES
   ============================================================ */
.home-cats-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; margin-bottom: 28px; flex-wrap: wrap;
}
.mode-switch { display: flex; gap: 6px; flex-shrink: 0; }
.mode-btn {
  display: flex; align-items: center; gap: 6px; padding: 8px 16px;
  border-radius: 50px; border: 1.5px solid var(--border);
  background: #fff; font-size: .82rem; font-weight: 600; color: var(--gray);
  transition: all .2s;
}
.mode-btn.active { background: var(--green); border-color: var(--green); color: #fff; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot-eco  { background: #4caf50; }
.dot-shop { background: #2196f3; }

.cats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
}

.cat-card {
  background: #fff; border: 1.5px solid var(--border);
  border-radius: 20px; overflow: hidden; cursor: pointer;
  transition: transform .25s, box-shadow .25s, border-color .25s;
  position: relative;
}
.cat-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 16px 48px rgba(0,0,0,.10);
  border-color: rgba(34,160,91,.3);
}
.cat-img {
  position: relative; height: 110px;
  display: flex; align-items: center; justify-content: center;
  font-size: 3rem;
}
.cat-card.eco  .cat-img { background: linear-gradient(145deg, #e8f5e9 0%, #f1f8e9 100%); }
.cat-card.shop .cat-img { background: linear-gradient(145deg, #e3f2fd 0%, #ede7f6 100%); }

.cat-type-badge {
  position: absolute; top: 10px; right: 10px;
  padding: 4px 10px; border-radius: 50px;
  font-size: .68rem; font-weight: 700; letter-spacing: .03em;
}
.eco-badge  { background: rgba(34,160,91,.15); color: #0f6b34; }
.shop-badge { background: rgba(33,150,243,.15); color: #1565c0; }

.cat-body { padding: 16px; }
.cat-body h3 { font-size: 1.05rem; margin-bottom: 4px; font-family: 'Outfit', sans-serif; font-weight: 600; }
.cat-body p  { font-size: .78rem; color: var(--gray); margin-bottom: 10px; }
.cat-cnt {
  display: inline-block; padding: 4px 12px; border-radius: 50px;
  font-size: .74rem; font-weight: 700;
}
.eco-cnt  { background: rgba(34,160,91,.10);  color: #0f6b34; }
.shop-cnt { background: rgba(33,150,243,.10); color: #1565c0; }

/* ============================================================
   CATALOG
   ============================================================ */
.back {
  background: none; border: none; font-size: .88rem; font-weight: 600;
  color: var(--gray); padding: 6px 0; margin-bottom: 24px;
  display: inline-flex; align-items: center; gap: 6px; transition: color .15s;
}
.back:hover { color: var(--black); }

.mode-banner {
  padding: 11px 18px; border-radius: 12px; font-size: .85rem; font-weight: 600; margin-bottom: 22px;
}
.eco-banner  { background: rgba(34,160,91,.08);  color: #0f6b34; border: 1px solid rgba(34,160,91,.18); }
.shop-banner { background: rgba(33,150,243,.08); color: #1565c0; border: 1px solid rgba(33,150,243,.18); }

.filters {
  display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 32px; align-items: flex-end;
}
.fg { display: flex; flex-direction: column; gap: 0; }
.fg input, .fg select { width: auto; }

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  padding: 7px 16px; border-radius: 50px; border: 1.5px solid var(--border);
  background: #fff; font-size: .82rem; font-weight: 600; color: var(--gray);
  transition: all .15s; font-family: 'Outfit', sans-serif;
}
.chip.active, .chip:hover { background: var(--green); border-color: var(--green); color: #fff; }

.loader { grid-column: 1/-1; text-align: center; color: var(--gray); padding: 60px 0; font-size: 1rem; }

/* ============================================================
   SELL FORM
   ============================================================ */
.sell-wrap { max-width: 740px; }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.fg-full { grid-column: 1 / -1; }
.form-group { display: flex; flex-direction: column; }

.cat-select-row { display: flex; gap: 10px; flex-wrap: wrap; }
.cat-sel {
  flex: 1; min-width: 80px; display: flex; flex-direction: column;
  align-items: center; gap: 7px; padding: 16px 10px;
  border: 2px solid var(--border); border-radius: 14px;
  cursor: pointer; transition: all .2s; background: #fff;
}
.cat-sel.active { border-color: var(--green); background: rgba(34,160,91,.05); }
.cs-em { font-size: 1.9rem; }
.cs-txt { font-size: .8rem; font-weight: 600; color: var(--mid); }

.photo-area {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; padding: 36px 20px; border: 2px dashed var(--border);
  border-radius: 16px; background: var(--warm); text-align: center; transition: border-color .2s;
}
.photo-area:hover { border-color: var(--green); }
.photo-area .icon { font-size: 2.2rem; }
.photo-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.photo-hint { font-size: .8rem; color: var(--gray); margin-top: 8px; }

#price-preview {
  display: none; margin-top: 12px; padding: 14px;
  background: var(--green-l); border-radius: 12px;
  font-size: .88rem; line-height: 1.9;
  border: 1.5px solid rgba(34,160,91,.2);
}

/* ============================================================
   ADMIN
   ============================================================ */
.a-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 22px 26px;
  background: linear-gradient(135deg, var(--green), var(--green-d));
  color: #fff; border-radius: 20px; margin-bottom: 24px;
  gap: 16px; flex-wrap: wrap;
}
.a-hdr h2 { font-size: 1.2rem; color: #fff; }
.stats-bar { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 14px; margin-bottom: 24px; }
.s-card {
  background: #fff; border: 1.5px solid var(--border);
  border-radius: var(--rr); padding: 18px 16px; text-align: center;
}
.s-card em { font-size: 1.6rem; font-style: normal; display: block; margin-bottom: 6px; }
.s-card b  { display: block; font-size: 1.5rem; font-weight: 700; }
.s-card small { color: var(--gray); font-size: .78rem; }

.atabs {
  display: flex; gap: 6px; border-bottom: 1.5px solid var(--border);
  margin-bottom: 24px; flex-wrap: wrap;
}
.atab {
  padding: 10px 18px; border: none; background: none;
  font-size: .88rem; font-weight: 600; color: var(--gray);
  border-bottom: 2.5px solid transparent; margin-bottom: -1.5px; transition: all .15s;
}
.atab.active { color: var(--green); border-bottom-color: var(--green); }

/* ============================================================
   CART SIDEBAR
   ============================================================ */
.cart-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(15,17,23,.55);
  z-index: 1100;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.cart-overlay.open { display: block; animation: fadeOverlay .3s ease; }
@keyframes fadeOverlay { from { opacity: 0; } to { opacity: 1; } }

.cart-drawer {
  position: fixed; top: 0; right: -100%; bottom: 0;
  width: 100%; max-width: 440px;
  background: #fff;
  z-index: 1101;
  display: flex; flex-direction: column;
  box-shadow: -16px 0 80px rgba(0,0,0,.18);
  transition: right .4s cubic-bezier(.22,1,.36,1);
  border-radius: 24px 0 0 24px;
}
.cart-drawer.open { right: 0; }

.cart-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 24px 26px 20px;
  background: linear-gradient(135deg, #0f1117 0%, #1e2330 100%);
  border-radius: 24px 0 0 0;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}
.cart-head::before {
  content: '';
  position: absolute; top: -30px; right: -30px;
  width: 140px; height: 140px;
  background: radial-gradient(circle, rgba(34,160,91,.25) 0%, transparent 70%);
  border-radius: 50%;
}
.cart-head-left { display: flex; flex-direction: column; gap: 4px; z-index: 1; }
.cart-head-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.6rem; font-weight: 700; color: #fff;
  display: flex; align-items: center; gap: 10px;
}
.cart-head-sub { font-size: .78rem; color: rgba(255,255,255,.45); font-weight: 400; }
.cart-count-pill {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--green); color: #fff;
  font-size: .7rem; font-weight: 700;
  min-width: 22px; height: 22px; border-radius: 50px;
  padding: 0 6px;
}

.cart-close {
  width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.08); color: rgba(255,255,255,.7);
  font-size: .9rem; transition: all .2s; z-index: 1;
  display: flex; align-items: center; justify-content: center;
}
.cart-close:hover { background: rgba(255,255,255,.18); color: #fff; border-color: rgba(255,255,255,.3); }

.cart-body {
  flex: 1; overflow-y: auto; padding: 20px 24px 0;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.cart-body::-webkit-scrollbar { width: 4px; }
.cart-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.cart-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; gap: 16px; color: var(--gray);
  padding-bottom: 60px;
}
.ce-icon-wrap {
  width: 96px; height: 96px; border-radius: 50%;
  background: linear-gradient(145deg, #f0faf5, #e8f5e9);
  display: flex; align-items: center; justify-content: center;
  font-size: 2.6rem;
  border: 2px solid rgba(34,160,91,.12);
}
.cart-empty h4 { font-size: 1.1rem; font-weight: 700; color: var(--black); font-family: 'Outfit', sans-serif; }
.cart-empty p { font-size: .85rem; text-align: center; line-height: 1.6; max-width: 220px; }
.cart-browse-btn {
  padding: 10px 24px; background: var(--green); color: #fff;
  border: none; border-radius: 50px; font-size: .85rem; font-weight: 700;
  font-family: 'Outfit', sans-serif; cursor: pointer; transition: all .2s;
}
.cart-browse-btn:hover { background: var(--green-d); transform: translateY(-1px); }

.cart-section-label {
  font-size: .72rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: var(--gray); margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}
.cart-section-label::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

.cart-item {
  display: flex; gap: 14px; padding: 16px 0;
  border-bottom: 1px solid var(--border); align-items: flex-start;
  animation: slideInCart .25s cubic-bezier(.22,1,.36,1);
  position: relative;
}
@keyframes slideInCart {
  from { opacity: 0; transform: translateX(24px); }
  to   { opacity: 1; transform: translateX(0); }
}

.ci-img {
  width: 72px; height: 72px; border-radius: 14px; object-fit: cover;
  background: var(--green-l); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 2rem;
  overflow: hidden; border: 1.5px solid var(--border);
}
.ci-img img { width: 100%; height: 100%; object-fit: cover; }

.ci-info { flex: 1; min-width: 0; }
.ci-title { font-size: .9rem; font-weight: 700; line-height: 1.3; color: var(--black); margin-bottom: 3px; }
.ci-sub   { font-size: .74rem; color: var(--gray); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.ci-sub-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--border); }
.ci-price { font-size: 1.05rem; font-weight: 700; color: var(--green-d); }

.ci-remove {
  background: none; border: none; color: var(--gray);
  font-size: .75rem; padding: 6px; transition: all .15s; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; flex-shrink: 0; margin-top: 2px;
}
.ci-remove:hover { color: var(--red); background: #fdecea; }

.cart-foot {
  padding: 16px 24px 28px;
  border-top: 1px solid var(--border);
  flex-shrink: 0; background: #fff;
  border-radius: 0 0 0 24px;
}

.cart-summary {
  background: var(--warm); border-radius: 16px;
  padding: 16px 18px; margin-bottom: 16px;
  border: 1.5px solid var(--border);
}
.cart-summary-row {
  display: flex; justify-content: space-between; align-items: center;
  font-size: .83rem; color: var(--gray); margin-bottom: 8px;
}
.cart-summary-row:last-child { margin-bottom: 0; }
.cart-summary-divider {
  height: 1px; background: var(--border); margin: 10px 0;
}
.cart-total-label { font-size: .95rem; font-weight: 700; color: var(--black); }
.cart-total-value { font-size: 1.4rem; font-weight: 700; color: var(--black); }

.cart-checkout-btn {
  width: 100%; padding: 16px; background: var(--green); color: #fff;
  border: none; border-radius: 16px; font-size: .95rem; font-weight: 700;
  font-family: 'Outfit', sans-serif; transition: all .22s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  cursor: pointer;
}
.cart-checkout-btn:hover {
  background: var(--green-d);
  box-shadow: 0 8px 28px rgba(34,160,91,.35);
  transform: translateY(-1px);
}
.cart-checkout-btn:active { transform: translateY(0); }

.cart-clear-btn {
  width: 100%; padding: 10px; background: none; color: var(--gray);
  border: 1.5px solid var(--border); border-radius: 12px;
  font-size: .8rem; font-weight: 600; font-family: 'Outfit', sans-serif;
  transition: all .2s; margin-top: 8px; cursor: pointer;
}
.cart-clear-btn:hover { color: var(--red); border-color: #fca5a5; background: #fef2f2; }

.cart-note {
  font-size: .73rem; color: var(--gray); text-align: center;
  margin-top: 10px; line-height: 1.5;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.cart-note::before { content: '🔒'; font-size: .9rem; }

/* ============================================================
   MODALS
   ============================================================ */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.45); z-index: 1000;
  align-items: center; justify-content: center;
  padding: 20px; backdrop-filter: blur(3px);
}
.overlay.open { display: flex; }
.modal {
  background: #fff; border-radius: 24px; padding: 36px;
  width: 100%; max-width: 480px; max-height: 90vh;
  overflow-y: auto; position: relative;
  box-shadow: 0 24px 80px rgba(0,0,0,.16);
  animation: popIn .28s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn { from { opacity:0; transform:scale(.92) translateY(10px); } to { opacity:1; transform:none; } }
.modal-x {
  position: absolute; top: 16px; right: 16px;
  width: 34px; height: 34px; border-radius: 50%; border: none;
  background: var(--warm); color: var(--gray); font-size: .85rem; transition: all .15s;
}
.modal-x:hover { background: var(--border); color: var(--black); }
.modal h3 { font-size: 1.4rem; margin-bottom: 8px; }

/* ============================================================
   TOAST
   ============================================================ */
.toast {
  position: fixed; bottom: 28px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--black); color: #fff;
  padding: 13px 26px; border-radius: 50px;
  font-size: .88rem; font-weight: 600; z-index: 9999;
  opacity: 0; transition: all .3s; white-space: nowrap;
  max-width: calc(100vw - 40px); box-shadow: 0 8px 32px rgba(0,0,0,.25);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { background: var(--green); }
.toast.err     { background: var(--red); }

/* ============================================================
   SCROLL-TOP
   ============================================================ */
#scroll-top {
  display: none; position: fixed; bottom: 28px; right: 24px;
  width: 44px; height: 44px; background: var(--black); color: #fff;
  border: none; border-radius: 50%; font-size: 1.1rem; z-index: 800;
  box-shadow: 0 6px 20px rgba(0,0,0,.2); transition: all .2s;
}
#scroll-top:hover { background: var(--green); transform: translateY(-3px); }

/* ============================================================
   FOOTER
   ============================================================ */
footer {
  background: var(--black); color: rgba(255,255,255,.45);
  text-align: center; padding: 36px 24px; font-size: .82rem;
}
.footer-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.5rem; font-weight: 700; color: #fff;
  margin-bottom: 10px; display: block;
}
.footer-logo em { color: var(--green); font-style: normal; }

/* ============================================================
   LIGHTBOX
   ============================================================ */
#lightbox {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.94); z-index: 9998;
  align-items: center; justify-content: center; padding: 16px;
}
